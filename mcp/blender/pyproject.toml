[project]
name = "digital-blender-mcp"
version = "0.1.0"
description = "FastMCP stdio bridge from Cursor to local Blender for Digital Team GLB kit parts"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=2.0.0",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "config", "catalog", "runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../scripts/blender"]

[tool.ruff]
line-length = 100
target-version = "py311"
